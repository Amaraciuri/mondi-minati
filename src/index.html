<script>
/* loader: visible from the first paint, before any game code arrives */
(function () {
  var it = window.__mmLang === 'it';
  var T = it
    ? ['Scarico i pianeti…', 'Costruisco i mondi…', 'Quasi pronto…', 'Connessione lenta, sto ancora caricando…']
    : ['Downloading the planets…', 'Building the worlds…', 'Almost ready…', 'Slow connection, still loading…'];
  var box = document.getElementById('loading'), bar = document.getElementById('ldBar'), pct = document.getElementById('ldPct'), txt = document.getElementById('loadingText');
  if (it) document.getElementById('ldTitle').innerHTML = '<span>MONDI</span> <span class="w2">MINATI</span>';
  var shown = 0, target = 0, stage = 0;
  window.__mmProgress = function (p, st) {
    target = Math.max(target, Math.min(1, p));
    if (st != null && st >= stage && T[st]) { stage = st; txt.textContent = T[st]; }
  };
  (function tick() {
    if (!box.isConnected) return;
    shown += (target - shown) * 0.2;
    if (Math.abs(target - shown) < 0.002) shown = target;
    bar.style.transform = 'scaleX(' + shown.toFixed(3) + ')';
    var v = Math.round(shown * 100);
    pct.textContent = v + '%';
    box.setAttribute('aria-valuenow', v);
    requestAnimationFrame(tick);
  })();
  window.__mmProgress(0.04, 0);
  setTimeout(function () { if (box.isConnected && target < 0.7) txt.textContent = T[3]; }, 9000);
})();
</script>
